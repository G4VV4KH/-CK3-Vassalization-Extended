l_japanese:
 ve_vassalization_group_name:0 "従属 — 条件を選択"
 ve_vassalization_group_desc:0 "展開して、将来の封臣の義務と宗教的権利を選択します。各選択肢には、必要な威信点、勝利時の条件、敗北時の結果が表示されます。"
 ve_refusal_risk_desc:0 "宣戦時に宗教的保護を選択できたにもかかわらず、それを提示せずに敗北した場合、攻撃側の[piety_level|E]がさらに一段階低下します。このリスクは宣戦時に確定し、戦争とともに継承されます。白紙和平ではこのペナルティは発生しません。"
 ve_religious_protection_available_tt:0 "宗教的保護は、バニラの契約条件を満たす場合に選択できます。両者の宗派が異なり、ジズヤまたは異教徒課税による制限がないことが必要です。ただし、すでに宗教的保護があり、称号剥奪からの保護がない契約には、バニラと同じ例外が適用されます。"
 ve_contract_lock_desc:0 "封建制の義務の設定は、合意に基づく契約変更として扱われ、その後の再交渉には通常の制限が適用されます。"
 ve_protection_rights_desc:0 "主君は封臣に改宗を要求できず、保護された領地で「伯爵領の改宗」を実行できません。また、称号を剥奪する際、宗派だけを理由に暴政とみなされることを回避できません。これは、あらゆる称号剥奪を防ぐ保護ではありません。この宗教的保証は、通常の契約交渉で取り消すことはできません。"
 ve_low_cb_desc:0 "封建制の税は軽く（基本税率2.5%）、徴募兵の貢献も低く（10%）設定されます。必要な威信点：通常の従属戦争の75%。敗北時の賠償金：通常の賠償金の75%。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "封建制の税（基本税率10%）と徴募兵の貢献（25%）は通常の水準に設定されます。ほかの政体では通常の義務が維持されます。必要な威信点と敗北時の賠償金：通常の従属戦争と同じ。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "封建制の税は重く（基本税率15%）、徴募兵の貢献も高く（35%）設定されます。必要な威信点：通常の従属戦争の150%。敗北時の賠償金：通常の賠償金の150%。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "すべての政体で宗教的保護が適用されます。封建制の封臣には通常の税（基本税率10%）と低い徴募兵の貢献（10%）が課されます。ほかの政体では通常の義務が維持されます。必要な威信点と敗北時の賠償金：通常の75%。保護を提示しなかったことによる献身レベルのペナルティはありません。\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U]は称号を保持したまま[attacker.GetShortUIName]の直属の封臣となり、軽い封建税と低い徴募兵の貢献が課されます。基本割合：税2.5%／徴募兵10%。$ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U]は称号を保持したまま[attacker.GetShortUIName]の直属の封臣となります。封建契約には通常の義務（基本割合：税10%／徴募兵25%）が課され、ほかの政体では通常の義務が維持されます。$ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U]は称号を保持したまま[attacker.GetShortUIName]の直属の封臣となり、重い封建税と高い徴募兵の貢献が課されます。基本割合：税15%／徴募兵35%。$ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U]は称号を保持したまま[attacker.GetShortUIName]の直属の封臣となり、宗教的保護を受けます。封建契約には通常の税と低い徴募兵の貢献（基本割合：10%／10%）が課され、ほかの政体では通常の義務が維持されます。\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U]は独立を維持します。[attacker.GetShortUIName|U]は通常の従属戦争の賠償金の75%（特別な補正の適用前では、通常は年収の2.25倍）を支払い、通常の敗北時の影響を受けます。\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U]は独立を維持します。[attacker.GetShortUIName|U]は通常の従属戦争の賠償金（特別な補正の適用前では、通常は年収の3倍）を支払い、通常の敗北時の影響を受けます。\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U]は独立を維持します。[attacker.GetShortUIName|U]は通常の従属戦争の賠償金の150%（特別な補正の適用前では、通常は年収の4.5倍）を支払い、通常の敗北時の影響を受けます。\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U]は独立を維持します。[attacker.GetShortUIName|U]は通常の従属戦争の賠償金の75%（特別な補正の適用前では、通常は年収の2.25倍）を支払い、通常の敗北時の影響を受けます。この開戦事由では、宗教的保護を提示しなかったことによる献身レベルのペナルティは発生しません。"
