l_polish:
 ve_vassalization_group_name:0 "Wasalizacja — wybór warunków"
 ve_vassalization_group_desc:0 "Rozwiń, aby wybrać zobowiązania i prawa religijne przyszłego wasala. Każdy wariant pokazuje koszt w prestiżu, warunki zwycięstwa i skutki porażki."
 ve_refusal_risk_desc:0 "Jeśli przy wypowiadaniu tej wojny dostępna była ochrona religijna, porażka bez jej zaoferowania dodatkowo kosztuje napastnika jeden [piety_level|E]. Ryzyko to ustala się przy wypowiedzeniu wojny i jest ono dziedziczone wraz z nią. Biały pokój nie powoduje tej kary."
 ve_religious_protection_available_tt:0 "Ochrona religijna musi być dostępna zgodnie z warunkami kontraktu w podstawowej grze: różne wiary oraz brak ograniczenia związanego z dżizją lub podatkiem od niewiernych. Wyjątkiem od tego ograniczenia jest, tak jak w podstawowej grze, kontrakt już zapewniający ochronę religijną, ale bez ochrony przed odebraniem tytułów."
 ve_contract_lock_desc:0 "Zobowiązania feudalne liczą się jako uzgodniona zmiana kontraktu, więc dalsze negocjacje podlegają zwykłemu ograniczeniu."
 ve_protection_rights_desc:0 "Senior nie może żądać nawrócenia wasala, wykonywać zadania Nawróć hrabstwo na chronionych ziemiach ani powoływać się wyłącznie na wiarę, by uniknąć tyranii przy odbieraniu tytułów. Nie jest to całkowita ochrona przed odebraniem tytułów. Gwarancji religijnej nie można znieść w ramach zwykłych negocjacji kontraktu."
 ve_low_cb_desc:0 "Niskie podatki feudalne (bazowo 2,5%) i mała liczba dostarczanych kmieci (10%). Koszt w prestiżu: 75% kosztu zwykłej wasalizacji. Reparacje po porażce: 75% zwykłej kwoty.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "Zwykłe podatki feudalne (bazowo 10%) i zwykła liczba dostarczanych kmieci (25%); inne ustroje zachowują swoje zwykłe zobowiązania. Koszt w prestiżu i reparacje po porażce: jak przy zwykłej wasalizacji.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "Wysokie podatki feudalne (bazowo 15%) i duża liczba dostarczanych kmieci (35%). Koszt w prestiżu: 150% kosztu zwykłej wasalizacji. Reparacje po porażce: 150% zwykłej kwoty.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "Ochrona religijna dla każdego ustroju. Wasale feudalni płacą zwykłe podatki (bazowo 10%) i dostarczają małą liczbę kmieci (10%); inne ustroje zachowują zwykłe zobowiązania. Koszt w prestiżu i reparacje po porażce: 75% zwykłych wartości. Brak kary do poziomu religijności za odmowę ochrony.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U] zostaje bezpośrednim wasalem postaci [attacker.GetShortUIName], zachowując swoje tytuły, z niskimi podatkami feudalnymi i małą liczbą dostarczanych kmieci. Stawki bazowe: 2,5% podatku / 10% pospolitego ruszenia. $ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U] zostaje bezpośrednim wasalem postaci [attacker.GetShortUIName], zachowując swoje tytuły. Kontrakty feudalne otrzymują zwykłe zobowiązania (bazowo 10% podatku / 25% pospolitego ruszenia); inne ustroje zachowują swoje zwykłe zobowiązania. $ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U] zostaje bezpośrednim wasalem postaci [attacker.GetShortUIName], zachowując swoje tytuły, z wysokimi podatkami feudalnymi i dużą liczbą dostarczanych kmieci. Stawki bazowe: 15% podatku / 35% pospolitego ruszenia. $ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U] zostaje bezpośrednim wasalem postaci [attacker.GetShortUIName], zachowując swoje tytuły i otrzymując ochronę religijną. Kontrakty feudalne otrzymują zwykłe podatki i małą liczbę dostarczanych kmieci (bazowo 10% / 10%); inne ustroje zachowują swoje zwykłe zobowiązania.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U] zachowuje niezależność. [attacker.GetShortUIName|U] płaci 75% zwykłych reparacji za wasalizację (zazwyczaj równowartość 2,25 rocznych dochodów, przed zastosowaniem specjalnych modyfikatorów) i ponosi zwykłe skutki porażki.\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U] zachowuje niezależność. [attacker.GetShortUIName|U] płaci zwykłe reparacje za wasalizację (zazwyczaj równowartość 3 rocznych dochodów, przed zastosowaniem specjalnych modyfikatorów) i ponosi zwykłe skutki porażki.\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U] zachowuje niezależność. [attacker.GetShortUIName|U] płaci 150% zwykłych reparacji za wasalizację (zazwyczaj równowartość 4,5 rocznych dochodów, przed zastosowaniem specjalnych modyfikatorów) i ponosi zwykłe skutki porażki.\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U] zachowuje niezależność. [attacker.GetShortUIName|U] płaci 75% zwykłych reparacji za wasalizację (zazwyczaj równowartość 2,25 rocznych dochodów, przed zastosowaniem specjalnych modyfikatorów) i ponosi zwykłe skutki porażki. Ten casus belli nie nakłada kary do poziomu religijności za odmowę ochrony religijnej."
