l_english:
 ve_vassalization_group_name:0 "Vassalization — choose the terms"
 ve_vassalization_group_desc:0 "Expand to choose the future vassal's obligations and religious rights. Each option shows its prestige cost, victory terms and defeat consequences."
 ve_refusal_risk_desc:0 "If Religious Protection was available when this war was declared, losing without offering it also costs the attacker one [piety_level|E]. This risk is fixed at declaration and inherited with the war. White peace does not incur this penalty."
 ve_religious_protection_available_tt:0 "Religious Protection must be available under the vanilla contract conditions: different faiths and no Jizya/nonbeliever-tax restriction, except the vanilla exception for an already protected contract without title-revocation protection."
 ve_contract_lock_desc:0 "The feudal obligations count as an agreed contract change and receive the ordinary restriction on further negotiation."
 ve_protection_rights_desc:0 "The liege cannot demand the vassal's conversion, use Convert Faith in County in the protected lands, or use faith alone to avoid tyranny when revoking titles. This is not blanket protection from title revocation. The religious guarantee cannot be traded away in ordinary contract negotiations."
 ve_low_cb_desc:0 "Low feudal taxes (base 2.5%) and levies (10%). Prestige cost: 75% of ordinary vassalization. Defeat reparations: 75% of ordinary reparations.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "Normal feudal taxes (base 10%) and levies (25%); other governments retain their ordinary obligations. Prestige cost and defeat reparations: ordinary vassalization rates.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "High feudal taxes (base 15%) and levies (35%). Prestige cost: 150% of ordinary vassalization. Defeat reparations: 150% of ordinary reparations.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "Religious protection for any government. Feudal vassals pay normal taxes (base 10%) and low levies (10%); other governments keep ordinary obligations. Prestige cost and defeat reparations: 75% of ordinary rates. No devotion penalty for refusing protection.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U] becomes a direct vassal of [attacker.GetShortUIName], retaining their titles, with low feudal taxes and levies. Base rates: 2.5% tax / 10% levies. $ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U] becomes a direct vassal of [attacker.GetShortUIName], retaining their titles. Feudal contracts receive normal obligations (base 10% tax / 25% levies); other governments retain ordinary obligations. $ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U] becomes a direct vassal of [attacker.GetShortUIName], retaining their titles, with high feudal taxes and levies. Base rates: 15% tax / 35% levies. $ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U] becomes a direct vassal of [attacker.GetShortUIName], retaining their titles and receiving religious protection. Feudal contracts receive normal taxes and low levies (base 10% / 10%); other governments retain ordinary obligations.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U] remains independent. [attacker.GetShortUIName|U] pays 75% of ordinary vassalization reparations (normally 2.25 annual incomes, before special modifiers) and suffers the ordinary defeat effects.\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U] remains independent. [attacker.GetShortUIName|U] pays ordinary vassalization reparations (normally 3 annual incomes, before special modifiers) and suffers the ordinary defeat effects.\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U] remains independent. [attacker.GetShortUIName|U] pays 150% of ordinary vassalization reparations (normally 4.5 annual incomes, before special modifiers) and suffers the ordinary defeat effects.\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U] remains independent. [attacker.GetShortUIName|U] pays 75% of ordinary vassalization reparations (normally 2.25 annual incomes, before special modifiers) and suffers the ordinary defeat effects. This CB incurs no devotion penalty for refusing religious protection."
 ve_default_cost_factor:0 "Normal obligations"
 ve_low_cost_factor:0 "Low obligations"
 ve_high_cost_factor:0 "High obligations"
 ve_religious_cost_factor:0 "Religious protection"
 ve_religious_protection:0 "Religious protection secured by peace"
 ve_religious_protection_none:0 "No peace guarantee"
 ve_religious_protection_none_short:0 "Not guaranteed"
 ve_religious_protection_none_desc:0 "This contract has no religious guarantee imposed by a Vassalization Extended peace settlement."
 ve_religious_protection_protected:0 "Religious protection secured by peace"
 ve_religious_protection_protected_short:0 "Protected by peace"
 ve_religious_protection_protected_desc:0 "$ve_protection_rights_desc$"
 ve_low_cb_name:0 "Vassalization: Low Obligations"
