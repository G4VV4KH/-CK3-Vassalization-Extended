l_french:
 ve_vassalization_group_name:0 "Vassalisation — choisir les conditions"
 ve_vassalization_group_desc:0 "Développez ce groupe pour choisir les obligations et les droits religieux du futur vassal. Chaque option indique son coût en prestige, les conditions de victoire et les conséquences d’une défaite."
 ve_refusal_risk_desc:0 "Si la protection religieuse était disponible lors de la déclaration de cette guerre, une défaite sans l’avoir proposée fait également perdre un [piety_level|E] à l’attaquant. Ce risque est fixé à la déclaration et se transmet avec la guerre en cas de succession. Une paix blanche n’entraîne pas cette pénalité."
 ve_religious_protection_available_tt:0 "La protection religieuse doit être disponible selon les conditions du contrat du jeu de base : des confessions différentes et aucune restriction liée à la djizîa ou à l’imposition des incroyants, sauf l’exception prévue pour un contrat bénéficiant déjà d’une protection religieuse, sans protection contre la révocation des titres."
 ve_contract_lock_desc:0 "Les obligations féodales comptent comme une modification du contrat acceptée par les deux parties et sont soumises à la restriction habituelle sur les renégociations."
 ve_protection_rights_desc:0 "Le seigneur lige ne peut pas exiger la conversion du vassal, utiliser la tâche Convertir le comté dans les terres protégées, ni invoquer la seule différence de foi pour éviter la tyrannie lors d’une révocation de titre. Cette protection n’interdit pas toutes les révocations de titres. La garantie religieuse ne peut pas être abandonnée lors des négociations ordinaires du contrat."
 ve_low_cb_desc:0 "Impôts féodaux bas (taux de base : 2,5 %) et faible contribution en levées (10 %). Coût en prestige : 75 % du coût d’une vassalisation ordinaire. Réparations en cas de défaite : 75 % des réparations ordinaires.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "Impôts féodaux normaux (taux de base : 10 %) et contribution normale en levées (25 %) ; les autres gouvernements conservent leurs obligations habituelles. Le coût en prestige et les réparations en cas de défaite sont ceux d’une vassalisation ordinaire.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "Impôts féodaux élevés (taux de base : 15 %) et contribution élevée en levées (35 %). Coût en prestige : 150 % du coût d’une vassalisation ordinaire. Réparations en cas de défaite : 150 % des réparations ordinaires.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "Protection religieuse pour tout type de gouvernement. Les vassaux féodaux paient des impôts normaux (taux de base : 10 %) et fournissent une faible contribution en levées (10 %) ; les autres conservent leurs obligations habituelles. Coût en prestige et réparations en cas de défaite : 75 % des montants ordinaires. Aucune perte de niveau de dévotion pour refus de protection.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'devenez', 'devient')] vassal direct de [attacker.GetShortUIName] et [Select_CString(defender.IsLocalPlayer, 'conservez vos', 'conserve ses')] titres, avec des impôts féodaux bas et une faible contribution en levées. Taux de base : 2,5 % d’impôts / 10 % de levées. $ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'devenez', 'devient')] vassal direct de [attacker.GetShortUIName] et [Select_CString(defender.IsLocalPlayer, 'conservez vos', 'conserve ses')] titres. Les contrats féodaux reçoivent des obligations normales (taux de base : 10 % d’impôts / 25 % de levées) ; les autres gouvernements conservent leurs obligations habituelles. $ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'devenez', 'devient')] vassal direct de [attacker.GetShortUIName] et [Select_CString(defender.IsLocalPlayer, 'conservez vos', 'conserve ses')] titres, avec des impôts féodaux élevés et une contribution élevée en levées. Taux de base : 15 % d’impôts / 35 % de levées. $ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'devenez', 'devient')] vassal direct de [attacker.GetShortUIName], [Select_CString(defender.IsLocalPlayer, 'conservez vos', 'conserve ses')] titres et [Select_CString(defender.IsLocalPlayer, 'bénéficiez', 'bénéficie')] d’une protection religieuse. Les contrats féodaux reçoivent des impôts normaux et une faible contribution en levées (taux de base : 10 % / 10 %) ; les autres gouvernements conservent leurs obligations habituelles.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservez votre', 'conserve son')] indépendance. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'payez', 'paie')] 75 % des réparations d’une vassalisation ordinaire (normalement 2,25 années de revenus, avant les modificateurs particuliers) et [Select_CString(attacker.IsLocalPlayer, 'subissez', 'subit')] les conséquences habituelles d’une défaite.\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservez votre', 'conserve son')] indépendance. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'payez', 'paie')] les réparations d’une vassalisation ordinaire (normalement 3 années de revenus, avant les modificateurs particuliers) et [Select_CString(attacker.IsLocalPlayer, 'subissez', 'subit')] les conséquences habituelles d’une défaite.\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservez votre', 'conserve son')] indépendance. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'payez', 'paie')] 150 % des réparations d’une vassalisation ordinaire (normalement 4,5 années de revenus, avant les modificateurs particuliers) et [Select_CString(attacker.IsLocalPlayer, 'subissez', 'subit')] les conséquences habituelles d’une défaite.\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservez votre', 'conserve son')] indépendance. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'payez', 'paie')] 75 % des réparations d’une vassalisation ordinaire (normalement 2,25 années de revenus, avant les modificateurs particuliers) et [Select_CString(attacker.IsLocalPlayer, 'subissez', 'subit')] les conséquences habituelles d’une défaite. Ce casus belli n’entraîne aucune perte de niveau de dévotion pour refus de protection religieuse."
