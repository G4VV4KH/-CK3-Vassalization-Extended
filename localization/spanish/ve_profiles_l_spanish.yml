l_spanish:
 ve_vassalization_group_name:0 "Avasallamiento — elegir las condiciones"
 ve_vassalization_group_desc:0 "Despliega este grupo para elegir las obligaciones y los derechos religiosos del futuro vasallo. Cada opción muestra su coste de prestigio, las condiciones de victoria y las consecuencias de una derrota."
 ve_refusal_risk_desc:0 "Si la protección religiosa estaba disponible al declarar esta guerra y no se ofreció, una derrota también le cuesta al atacante un [piety_level|E]. Este riesgo se fija al declarar la guerra y se hereda junto con ella. La paz blanca no conlleva esta penalización."
 ve_religious_protection_available_tt:0 "La protección religiosa debe estar disponible según las condiciones del contrato del juego base: fes distintas y ninguna restricción por la yizia o el gravamen a los no creyentes, salvo la excepción del juego base para un contrato que ya tenga protección religiosa, pero no protección contra la revocación de títulos."
 ve_contract_lock_desc:0 "Las obligaciones feudales cuentan como un cambio de contrato acordado y quedan sujetas a la restricción habitual sobre futuras negociaciones."
 ve_protection_rights_desc:0 "El señor no puede exigir la conversión del vasallo, usar Convertir fe del condado en las tierras protegidas ni alegar únicamente la diferencia de fe para evitar la tiranía al revocar títulos. Esto no protege frente a todas las revocaciones de títulos. La garantía religiosa no puede eliminarse en las negociaciones ordinarias del contrato."
 ve_low_cb_desc:0 "Impuestos feudales bajos (base: 2,5 %) y contribución a levas baja (10 %). Coste de prestigio: 75 % de un avasallamiento ordinario. Reparaciones por derrota: 75 % de las reparaciones ordinarias.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "Impuestos feudales normales (base: 10 %) y contribución a levas normal (25 %); los demás gobiernos conservan sus obligaciones habituales. El coste de prestigio y las reparaciones por derrota son los de un avasallamiento ordinario.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "Impuestos feudales altos (base: 15 %) y contribución a levas alta (35 %). Coste de prestigio: 150 % de un avasallamiento ordinario. Reparaciones por derrota: 150 % de las reparaciones ordinarias.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "Protección religiosa para cualquier gobierno. Los vasallos feudales pagan impuestos normales (base: 10 %) y aportan una contribución a levas baja (10 %); los demás conservan sus obligaciones habituales. Coste de prestigio y reparaciones por derrota: 75 % de los importes ordinarios. No se pierde ningún nivel de devoción por rechazar la protección.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'pasas', 'pasa')] a ser vasallo directo de [Select_CString(attacker.IsLocalPlayer, 'ti', attacker.GetShortUIName)] y [Select_CString(defender.IsLocalPlayer, 'conservas tus', 'conserva sus')] títulos, con impuestos feudales bajos y una contribución a levas baja. Porcentajes básicos: 2,5 % de impuestos / 10 % de levas. $ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'pasas', 'pasa')] a ser vasallo directo de [Select_CString(attacker.IsLocalPlayer, 'ti', attacker.GetShortUIName)] y [Select_CString(defender.IsLocalPlayer, 'conservas tus', 'conserva sus')] títulos. Los contratos feudales reciben obligaciones normales (base: 10 % de impuestos / 25 % de levas); los demás gobiernos conservan sus obligaciones habituales. $ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'pasas', 'pasa')] a ser vasallo directo de [Select_CString(attacker.IsLocalPlayer, 'ti', attacker.GetShortUIName)] y [Select_CString(defender.IsLocalPlayer, 'conservas tus', 'conserva sus')] títulos, con impuestos feudales altos y una contribución a levas alta. Porcentajes básicos: 15 % de impuestos / 35 % de levas. $ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'pasas', 'pasa')] a ser vasallo directo de [Select_CString(attacker.IsLocalPlayer, 'ti', attacker.GetShortUIName)], [Select_CString(defender.IsLocalPlayer, 'conservas tus', 'conserva sus')] títulos y [Select_CString(defender.IsLocalPlayer, 'recibes', 'recibe')] protección religiosa. Los contratos feudales reciben impuestos normales y una contribución a levas baja (base: 10 % / 10 %); los demás gobiernos conservan sus obligaciones habituales.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservas tu', 'conserva su')] independencia. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'pagas', 'paga')] el 75 % de las reparaciones de un avasallamiento ordinario (normalmente 2,25 años de ingresos, antes de los modificadores especiales) y [Select_CString(attacker.IsLocalPlayer, 'sufres', 'sufre')] las consecuencias habituales de la derrota.\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservas tu', 'conserva su')] independencia. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'pagas', 'paga')] las reparaciones de un avasallamiento ordinario (normalmente 3 años de ingresos, antes de los modificadores especiales) y [Select_CString(attacker.IsLocalPlayer, 'sufres', 'sufre')] las consecuencias habituales de la derrota.\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservas tu', 'conserva su')] independencia. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'pagas', 'paga')] el 150 % de las reparaciones de un avasallamiento ordinario (normalmente 4,5 años de ingresos, antes de los modificadores especiales) y [Select_CString(attacker.IsLocalPlayer, 'sufres', 'sufre')] las consecuencias habituales de la derrota.\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'conservas tu', 'conserva su')] independencia. [attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'pagas', 'paga')] el 75 % de las reparaciones de un avasallamiento ordinario (normalmente 2,25 años de ingresos, antes de los modificadores especiales) y [Select_CString(attacker.IsLocalPlayer, 'sufres', 'sufre')] las consecuencias habituales de la derrota. Este casus belli no provoca ninguna pérdida de nivel de devoción por rechazar la protección religiosa."
