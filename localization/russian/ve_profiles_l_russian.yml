l_russian:
 ve_vassalization_group_name:0 "Вассализация — выбор условий"
 ve_vassalization_group_desc:0 "Разверните группу, чтобы выбрать обязательства и религиозные права будущего вассала. У каждого варианта указаны цена в престиже, условия победы и последствия поражения."
 ve_refusal_risk_desc:0 "Если при объявлении войны была доступна религиозная защита, поражение при выборе другого варианта дополнительно отнимет у нападающего один [Concept('piety_level', 'уровень набожности')|E]. Этот риск фиксируется при объявлении и наследуется вместе с войной. При белом мире штрафа нет."
 ve_religious_protection_available_tt:0 "Религиозная защита должна быть доступна по условиям ванильного договора: разные конфессии и отсутствие ограничения джизьи/налога на иноверцев, кроме ванильного исключения для уже защищённого договора без защиты от отзыва титулов."
 ve_contract_lock_desc:0 "Феодальные обязательства считаются согласованным изменением договора: на дальнейший пересмотр действует обычное ограничение переговоров."
 ve_protection_rights_desc:0 "Сюзерен не может требовать обращения вассала, обращать графства защищённых земель и использовать различие веры как основание для отзыва титулов без тирании. Это не полный запрет отзыва титулов. Религиозную гарантию нельзя отменить обычным пересмотром договора."
 ve_low_cb_desc:0 "Низкие феодальные налоги (база 2,5%) и ополчение (10%). Цена в престиже: 75% обычной вассализации. Контрибуция при поражении: 75% обычной.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "Обычные феодальные налоги (база 10%) и ополчение (25%); при других формах правления сохраняются обычные обязательства. Цена в престиже и контрибуция — как при обычной вассализации.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "Высокие феодальные налоги (база 15%) и ополчение (35%). Цена в престиже: 150% обычной вассализации. Контрибуция при поражении: 150% обычной.\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "Религиозная защита при любой форме правления. У феодалов — обычные налоги (база 10%) и низкое ополчение (10%); у остальных — обычные обязательства. Цена в престиже и контрибуция: 75% обычных. Штрафа к набожности за отказ от защиты нет.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U] становится прямым вассалом [attacker.GetShortUIName], сохраняя титулы, с низкими феодальными налогами и ополчением. Базовые ставки: 2,5% налогов / 10% ополчения. $ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U] становится прямым вассалом [attacker.GetShortUIName], сохраняя титулы. У феодалов — обычные обязательства (база 10% налогов / 25% ополчения); у остальных — обычные обязательства их формы правления. $ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U] становится прямым вассалом [attacker.GetShortUIName], сохраняя титулы, с высокими феодальными налогами и ополчением. Базовые ставки: 15% налогов / 35% ополчения. $ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U] становится прямым вассалом [attacker.GetShortUIName], сохраняя титулы и получая религиозную защиту. У феодалов — обычные налоги и низкое ополчение (база 10% / 10%); у остальных — обычные обязательства их формы правления.\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U] остаётся независимым правителем. [attacker.GetShortUIName|U] платит 75% обычной контрибуции за вассализацию (как правило, 2,25 годовых дохода до особых модификаторов) и несёт обычные последствия поражения.\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U] остаётся независимым правителем. [attacker.GetShortUIName|U] платит обычную контрибуцию за вассализацию (как правило, 3 годовых дохода до особых модификаторов) и несёт обычные последствия поражения.\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U] остаётся независимым правителем. [attacker.GetShortUIName|U] платит 150% обычной контрибуции за вассализацию (как правило, 4,5 годовых дохода до особых модификаторов) и несёт обычные последствия поражения.\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U] остаётся независимым правителем. [attacker.GetShortUIName|U] платит 75% обычной контрибуции за вассализацию (как правило, 2,25 годовых дохода до особых модификаторов) и несёт обычные последствия поражения. Этот CB не штрафует набожность за отказ от религиозной защиты."
