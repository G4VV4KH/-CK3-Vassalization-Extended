l_simp_chinese:
 ve_vassalization_group_name:0 "附庸——选择条款"
 ve_vassalization_group_desc:0 "展开以选择未来封臣的义务与宗教权利。每个选项都会显示威望花费、胜利条款及战败后果。"
 ve_refusal_risk_desc:0 "如果宣战时可以提供宗教保护，却选择不提供，战败时进攻方还会失去一级[piety_level|E]。这一风险在宣战时确定，并随战争一同继承。无条件和平不会触发此惩罚。"
 ve_religious_protection_available_tt:0 "宗教保护须满足原版契约的条件：双方信仰不同，且不受吉兹亚或异教徒税相关限制；但原版已有的例外仍适用，即契约已提供宗教保护，却未提供头衔剥夺保护。"
 ve_contract_lock_desc:0 "这些封建义务视为双方同意的契约变更，因此后续协商受到通常的限制。"
 ve_protection_rights_desc:0 "领主不能要求该封臣改信，不能对受保护的领地使用“改变伯爵领信仰”，也不能仅以信仰为由在剥夺头衔时免受暴政惩罚。这并不意味着完全禁止剥夺头衔。宗教保障不能通过常规契约协商取消。"
 ve_low_cb_desc:0 "低封建赋税（基础税率2.5%）和低征召兵贡献（10%）。威望花费：普通附庸战争的75%。战败赔款：普通赔款的75%。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_default_cb_desc:0 "正常封建赋税（基础税率10%）和正常征召兵贡献（25%）；其他政体保留其通常义务。威望花费和战败赔款按普通附庸战争的标准计算。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_high_cb_desc:0 "高封建赋税（基础税率15%）和高征召兵贡献（35%）。威望花费：普通附庸战争的150%。战败赔款：普通赔款的150%。\n\n$ve_contract_lock_desc$\n\n$ve_refusal_risk_desc$"
 ve_religious_cb_desc:0 "适用于任何政体的宗教保护。封建封臣缴纳正常赋税（基础税率10%）并提供低征召兵贡献（10%）；其他政体保留通常义务。威望花费和战败赔款：普通标准的75%。不会受到拒绝提供保护所导致的奉献等级惩罚。\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_victory_desc:0 "[defender.GetShortUIName|U]成为[attacker.GetShortUIName]的直属封臣，保留自己的头衔，承担低封建赋税和低征召兵贡献。基础比例：2.5%赋税／10%征召兵。$ve_contract_lock_desc$"
 ve_default_victory_desc:0 "[defender.GetShortUIName|U]成为[attacker.GetShortUIName]的直属封臣，并保留自己的头衔。封建契约设为正常义务（基础比例为10%赋税／25%征召兵）；其他政体保留通常义务。$ve_contract_lock_desc$"
 ve_high_victory_desc:0 "[defender.GetShortUIName|U]成为[attacker.GetShortUIName]的直属封臣，保留自己的头衔，承担高封建赋税和高征召兵贡献。基础比例：15%赋税／35%征召兵。$ve_contract_lock_desc$"
 ve_religious_victory_desc:0 "[defender.GetShortUIName|U]成为[attacker.GetShortUIName]的直属封臣，保留自己的头衔并获得宗教保护。封建契约设为正常赋税和低征召兵贡献（基础比例为10%／10%）；其他政体保留通常义务。\n\n$ve_protection_rights_desc$\n\n$ve_contract_lock_desc$"
 ve_low_defeat_desc:0 "[defender.GetShortUIName|U]仍保持独立。[attacker.GetShortUIName|U]支付普通附庸战争赔款的75%（通常为未计特殊修正前的2.25年收入），并承受通常的战败效果。\n\n$ve_refusal_risk_desc$"
 ve_default_defeat_desc:0 "[defender.GetShortUIName|U]仍保持独立。[attacker.GetShortUIName|U]支付普通附庸战争赔款（通常为未计特殊修正前的3年收入），并承受通常的战败效果。\n\n$ve_refusal_risk_desc$"
 ve_high_defeat_desc:0 "[defender.GetShortUIName|U]仍保持独立。[attacker.GetShortUIName|U]支付普通附庸战争赔款的150%（通常为未计特殊修正前的4.5年收入），并承受通常的战败效果。\n\n$ve_refusal_risk_desc$"
 ve_religious_defeat_desc:0 "[defender.GetShortUIName|U]仍保持独立。[attacker.GetShortUIName|U]支付普通附庸战争赔款的75%（通常为未计特殊修正前的2.25年收入），并承受通常的战败效果。此宣战理由不会触发拒绝提供宗教保护所导致的奉献等级惩罚。"
