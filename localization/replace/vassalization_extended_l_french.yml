 game_concept_vassalize_casus_belli_desc:0 "Un [casus_belli|E] permettant la [vassalization|E] forcée d’un [ruler|E] indépendant, voisin et de rang inférieur. Il est normalement débloqué par l’[perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )] ; les autres moyens de déblocage admissibles du jeu de base restent valables.\n\nVassalization Extended supprime la limite de comtés et permet de choisir les conditions. Pour les cibles féodales, vous pouvez choisir des obligations faibles, normales ou élevées, ou une protection religieuse ; pour les autres gouvernements, des conditions normales ou une protection religieuse. La protection suit les conditions d’admissibilité des contrats du jeu de base. Le coût en prestige et les réparations en cas de défaite dépendent de l’option choisie. Si la protection était disponible à la déclaration, une défaite avec une autre option fait perdre un niveau de dévotion."
