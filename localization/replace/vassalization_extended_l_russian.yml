l_russian:
 game_concept_vassalize_casus_belli_desc:0 "[Concept('casus_belli', 'Казус белли')|E] для принудительной [Concept('vassalization', 'вассализации')|El] независимого соседнего [Concept('ruler', 'правителя')|El] более низкого ранга. Обычно открывается достоинством «[GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )]»; другие ванильные способы получения этого казус белли также сохраняются.\n\nVassalization Extended снимает ограничение числа графств и позволяет выбрать условия вассализации. Феодалам доступны низкие, обычные и высокие обязательства либо религиозная защита; остальным — обычные условия либо религиозная защита. Доступность защиты определяется условиями ванильного договора. Цена и контрибуция зависят от выбранного варианта. Если при объявлении религиозная защита была доступна, поражение с другим вариантом отнимает один уровень набожности."
