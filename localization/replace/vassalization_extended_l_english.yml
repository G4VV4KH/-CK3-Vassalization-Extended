l_english:
 game_concept_vassalize_casus_belli_desc:0 "A [casus_belli|E] allowing the forceful [vassalization|E] of an independent neighboring [ruler|E] of lower rank. It is normally unlocked by the [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )] [perk|E]; other qualifying vanilla unlock routes still apply.\n\nVassalization Extended removes the county limit and lets you choose the terms. Feudal targets offer low, normal or high obligations, or religious protection; other governments offer normal terms or religious protection. Protection follows the vanilla contract eligibility conditions. Prestige cost and defeat reparations depend on the chosen option. If protection was available at declaration, defeat with a different option costs one level of devotion."
