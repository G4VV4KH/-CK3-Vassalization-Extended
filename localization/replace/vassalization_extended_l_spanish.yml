l_spanish:
 game_concept_vassalize_casus_belli_desc:0 "Un [casus_belli|E] que permite el [vassalization|E] por la fuerza de un [ruler|E] independiente, vecino y de rango inferior. Normalmente se desbloquea con el [perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )]; las demás vías de desbloqueo válidas del juego base siguen siendo aplicables.\n\nVassalization Extended elimina el límite de condados y permite elegir las condiciones. Para los objetivos feudales se pueden elegir obligaciones bajas, normales o altas, o protección religiosa; para los demás gobiernos, condiciones normales o protección religiosa. La protección sigue los requisitos de los contratos del juego base. El coste de prestigio y las reparaciones por derrota dependen de la opción elegida. Si la protección estaba disponible al declarar la guerra, una derrota con otra opción cuesta un nivel de devoción."
