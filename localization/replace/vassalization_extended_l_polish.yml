l_polish:
 game_concept_vassalize_casus_belli_desc:0 "[casus_belli|E], którego celem jest wymuszona [vassalization|E]. Można go użyć, gdy celem jest niezależny, sąsiedni [ruler|E] o niższej randze. Zwykle odblokowuje go [perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )]; pozostałe sposoby odblokowania dostępne w podstawowej grze nadal obowiązują.\n\nVassalization Extended znosi limit hrabstw i pozwala wybrać warunki. W przypadku celów feudalnych można wybrać niskie, zwykłe lub wysokie zobowiązania albo ochronę religijną; przy innych ustrojach dostępne są zwykłe warunki lub ochrona religijna. Ochrona wymaga spełnienia warunków kontraktu z podstawowej gry. Koszt w prestiżu i reparacje po porażce zależą od wybranego wariantu. Jeśli przy wypowiedzeniu wojny ochrona była dostępna, porażka po wybraniu innego wariantu kosztuje jeden poziom religijności."
