l_german:
 game_concept_vassalize_casus_belli_desc:0 "Ein [casus_belli|E] für die erzwungene [vassalization|E]. Das Ziel muss ein unabhängiger benachbarter [ruler|E] von niedrigerem Rang sein. Der Kriegsgrund wird normalerweise durch den [perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )] freigeschaltet; andere zulässige Freischaltmöglichkeiten des Grundspiels gelten weiterhin.\n\nVassalization Extended entfernt die Obergrenze für die Anzahl der Grafschaften und lässt Euch die Bedingungen wählen. Bei feudalen Zielen stehen niedrige, normale oder hohe Pflichten sowie religiöser Schutz zur Wahl; bei anderen Regierungsformen normale Bedingungen oder religiöser Schutz. Für den Schutz gelten die Vertragsvoraussetzungen des Grundspiels. Prestigekosten und Reparationen bei Niederlage hängen von der gewählten Option ab. War Schutz bei der Kriegserklärung verfügbar, kostet eine Niederlage mit einer anderen Option eine Hingabestufe."
